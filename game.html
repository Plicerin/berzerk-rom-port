<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Berzerk 2600 — game only</title>
  <style>
    :root { color-scheme: dark; --bg: #0c0a10; --panel: #17131d; --fg: #efe9f4; --muted: #a399ae; --accent: #545cd6; --border: rgba(255, 255, 255, 0.12); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
    main { width: min(760px, 100%); display: grid; gap: 12px; }
    canvas { display: block; width: 100%; aspect-ratio: 640 / 382; image-rendering: pixelated; background: #000; border-radius: 8px; outline: none; }
    canvas:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button[aria-pressed="true"] { color: var(--accent); }
    #hint { color: var(--muted); margin: 0; }
    .touch { display: none; justify-content: space-between; align-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
    .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 48px); gap: 4px; }
    .dpad [data-hold="up"] { grid-area: 1 / 2; } .dpad [data-hold="left"] { grid-area: 2 / 1; }
    .dpad [data-hold="right"] { grid-area: 2 / 3; } .dpad [data-hold="down"] { grid-area: 3 / 2; }
    .dpad button { padding: 0; font-size: 18px; touch-action: none; }
    .jump { width: 92px; height: 92px; border-radius: 50%; touch-action: none; }
    @media (pointer: coarse) { .touch { display: flex; } }
  </style>
</head>
<body>
  <main id="player">
    <canvas width="640" height="382" tabindex="0" aria-label="Berzerk. Arrow keys or WASD to move, hold Space or Z to shoot, Enter for Game Reset, G for Game Select."></canvas>
    <div class="bar">
      <button type="button" data-play>Play</button>
      <button type="button" data-select>Game Select</button>
      <button type="button" data-reset>Game Reset</button>
      <button type="button" data-pause>Pause</button>
      <button type="button" data-mute aria-pressed="false">Mute</button>
      <a href="./" style="margin-left: auto; color: var(--accent)">About this port</a>
    </div>
    <div class="touch" aria-label="Touch controls">
      <div class="dpad">
        <button type="button" data-hold="up" aria-label="Up">▲</button>
        <button type="button" data-hold="left" aria-label="Left">◀</button>
        <button type="button" data-hold="right" aria-label="Right">▶</button>
        <button type="button" data-hold="down" aria-label="Down">▼</button>
      </div>
      <button type="button" class="jump" data-hold="fire">Fire</button>
    </div>
    <p id="hint" data-hint>Click the game to start game 1. Hold Space to shoot. G is Game Select, Enter is Game Reset. P pauses, M mutes.</p>
  </main>
  <script type="module">
    import { mountPlayer } from './src/berzerkPlayer.mjs';
    window.__berzerk = mountPlayer(document.getElementById('player'));
  </script>
</body>
</html>
